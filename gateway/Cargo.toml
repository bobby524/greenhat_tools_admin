[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
http-body-util = "0.1"
deadpool-redis = { version = "0.18", features = ["rt_tokio_1"] }
hyper = { version = "1", features = ["full"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "propagate-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"

# OpenTelemetry (optional — enable with `cargo build --features otel`)
opentelemetry      = { version = "0.31", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk  = { version = "0.31", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

[dev-dependencies]
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
