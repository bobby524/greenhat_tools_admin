name: Deploy API to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: runtime panic guard
        run: ./scripts/check-runtime-panics.sh

      - name: Deploy to Fly (greenhat-tools-admin-cmmugg)
        run: flyctl deploy --remote-only -a greenhat-tools-admin-cmmugg
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
