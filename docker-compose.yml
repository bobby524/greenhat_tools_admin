services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Loads .env at compose-up time; values are injected into the container.
    # Only .env.example is committed — operators copy it to .env locally.
    env_file:
      - .env
    environment:
      # Explicit overrides (always applied, take precedence over .env).
      - RUST_LOG=gateway=debug,tower_http=debug
      # Set REDIS_URL to enable caching; omit or leave empty to run without.
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # healthcheck using the /health endpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  redis-data:
