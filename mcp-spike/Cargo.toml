[package]
name = "mcp-spike"
version = "0.1.0"
edition = "2021"

# Path dependency into the vendored MCP Rust SDK submodule.
# This proves compilation against the local checkout.
[dependencies]
rmcp = { path = "../vendor/mcp-rust-sdk/crates/rmcp", features = [
    "server",
    "client",
    "macros",
    "transport-async-rw",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
